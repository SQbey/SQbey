    .l7 { animation-name: a7; }
    @keyframes a1 { 0%, 2% { opacity: 0; } 4%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes a2 { 0%, 8% { opacity: 0; } 10%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes a3 { 0%, 16% { opacity: 0; } 18%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
